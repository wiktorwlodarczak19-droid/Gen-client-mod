plugins {
    id 'fabric-loom' version '1.8.13'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

tasks.register("verifySourceLayout") {
    doLast {
        def javaFiles = sourceSets.main.allJava.files
        def resourceFiles = sourceSets.main.resources.files
        println "MAIN JAVA ROOTS: ${sourceSets.main.java.srcDirs}"
        println "MAIN JAVA FILES: ${javaFiles}"
        println "MAIN RESOURCE ROOTS: ${sourceSets.main.resources.srcDirs}"
        println "MAIN RESOURCE FILES: ${resourceFiles}"
        if (!javaFiles.any { it.name == "GenClient.java" }) {
            throw new GradleException("GenClient.java is not part of sourceSets.main")
        }
        if (!resourceFiles.any { it.name == "fabric.mod.json" }) {
            throw new GradleException("fabric.mod.json is not part of sourceSets.main")
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Build a deterministic named/intermediate archive outside Loom's default
// dev-jar task. The remapJar task below consumes this exact file.
def genClientNamedJar = tasks.register("genClientNamedJar", Jar) {
    group = "build"
    description = "Packages compiled GEN CLIENT classes and processed resources before remapping."
    dependsOn(tasks.named("classes"))
    archiveClassifier.set("named")
    destinationDirectory.set(layout.buildDirectory.dir("intermediates"))
    from(layout.buildDirectory.dir("classes/java/main"))
    from(layout.buildDirectory.dir("resources/main"))

    doLast {
        def archive = archiveFile.get().asFile
        if (!archive.isFile() || archive.length() < 1000) {
            throw new GradleException("GEN CLIENT intermediate JAR is missing or unexpectedly small: ${archive}")
        }
        def entries = zipTree(archive)
        ["pl/genclient/GenClient.class",
         "pl/genclient/VisualsScreen.class",
         "pl/genclient/ModBadgeHud.class",
         "fabric.mod.json"].each { entry ->
            if (entries.matching { include entry }.files.isEmpty()) {
                throw new GradleException("GEN CLIENT intermediate JAR is missing ${entry}")
            }
        }
        println "Verified GEN CLIENT intermediate JAR: ${archive} (${archive.length()} bytes)"
    }
}

// Loom's remapJar is the installable artifact. Set its input after Loom has
// finished configuring its defaults so the exact, verified archive above is
// what gets remapped to intermediary names.
afterEvaluate {
    tasks.named("remapJar") {
        dependsOn(genClientNamedJar)
        inputFile.set(genClientNamedJar.flatMap { it.archiveFile })
    }
}
