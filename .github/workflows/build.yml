name: Build GEN CLIENT
on:
  push:
    branches: ["main", "feature/gen-client-0.3.0", "feature/gen-client-polish-2026-11-07", "feature/dynamic-island-layout-2026-11-11", "feature/dynamic-island-typography-2026-11-11"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify complete project layout
        shell: bash
        run: |
          set -euo pipefail
          test -f src/main/java/pl/genclient/client/GenClient.java
          test -f src/main/java/pl/genclient/client/GenHud.java
          test -f src/main/java/pl/genclient/client/VisualEffects.java
          test -f src/main/java/pl/genclient/client/SpotifyService.java
          test -f src/main/java/pl/genclient/config/ClientConfig.java
          test -f src/main/java/pl/genclient/gui/GenMainMenuScreen.java
          test -f src/main/java/pl/genclient/gui/GenPauseMenuScreen.java
          test -f src/main/java/pl/genclient/gui/VisualsScreen.java
          test -f src/main/java/pl/genclient/gui/GenHubScreen.java
          test -f src/main/java/pl/genclient/gui/SpotifyScreen.java
          test -f src/main/java/pl/genclient/gui/StyleScreen.java
          test -f src/main/resources/fabric.mod.json
          test -f src/main/resources/genclient.mixins.json
          test -f src/main/java/pl/genclient/mixin/ClientWorldMixin.java
          test -f src/main/resources/assets/genclient/textures/gui/logo_mark.png
          test -f src/main/resources/assets/genclient/textures/gui/logo_text.png
          test -f src/main/resources/assets/genclient/textures/gui/wallpapers/sakura_dark.jpg
          test -f src/main/resources/assets/genclient/textures/gui/wallpapers/midnight_ink.jpg
          test -f src/main/resources/assets/genclient/textures/gui/wallpapers/main_menu_mountains.jpg
          test -f src/main/resources/assets/genclient/font/ui.json
          test -f src/main/resources/assets/genclient/font/ui_medium.json
          test -s src/main/resources/assets/genclient/font/Poppins-Regular.ttf
          test -s src/main/resources/assets/genclient/font/Poppins-Medium.ttf
          test -f src/main/resources/licenses/Poppins-OFL.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "ui": "genclient:font/Poppins-Regular.ttf",
              "ui_medium": "genclient:font/Poppins-Medium.ttf",
          }
          for font_id, font_file in expected.items():
              path = Path(f"src/main/resources/assets/genclient/font/{font_id}.json")
              data = json.loads(path.read_text())
              provider = data["providers"][0]
              assert provider["type"] == "ttf", (font_id, provider)
              assert provider["file"] == font_file, (font_id, provider)
              assert provider["size"] >= 8.0, (font_id, provider)
          license_text = Path("src/main/resources/licenses/Poppins-OFL.txt").read_text()
          assert "SIL OPEN FONT LICENSE Version 1.1" in license_text
          print("Bundled Poppins font providers and OFL license verified.")
          PY
          echo "All GEN CLIENT sources and resources are present."

      - name: Build with Fabric Loom
        run: gradle --no-daemon --no-build-cache clean build

      - name: Verify the installable remapped JAR
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          JAR="build/libs/gen-client-${VERSION}.jar"

          echo "=== Generated archives ==="
          find build/libs -maxdepth 1 -type f -name '*.jar' -printf '%f (%s bytes)\n' | sort

          test -s "$JAR"
          SIZE="$(stat -c '%s' "$JAR")"
          echo "Installable JAR size: $SIZE bytes"
          test "$SIZE" -gt 12000

          jar tf "$JAR" | tee /tmp/gen-client-jar-contents.txt
          for entry in \
            pl/genclient/client/GenClient.class \
            pl/genclient/client/GenHud.class \
            pl/genclient/client/VisualEffects.class \
            pl/genclient/client/SpotifyService.class \
            pl/genclient/config/ClientConfig.class \
            pl/genclient/gui/GenButton.class \
            pl/genclient/gui/GenHubScreen.class \
            pl/genclient/gui/SpotifyScreen.class \
            pl/genclient/gui/GenMainMenuScreen.class \
            pl/genclient/gui/GenPauseMenuScreen.class \
            pl/genclient/gui/GenScreen.class \
            pl/genclient/gui/StyleScreen.class \
            pl/genclient/gui/UiDraw.class \
            pl/genclient/gui/VisualsScreen.class \
            pl/genclient/mixin/ClientWorldMixin.class \
            fabric.mod.json \
            genclient.mixins.json \
            genclient.refmap.json \
            assets/genclient/textures/gui/logo_mark.png \
            assets/genclient/textures/gui/logo_text.png \
            assets/genclient/textures/gui/wallpapers/sakura_dark.jpg \
            assets/genclient/textures/gui/wallpapers/midnight_ink.jpg \
            assets/genclient/textures/gui/wallpapers/main_menu_mountains.jpg \
            assets/genclient/font/ui.json \
            assets/genclient/font/ui_medium.json \
            assets/genclient/font/Poppins-Regular.ttf \
            assets/genclient/font/Poppins-Medium.ttf \
            licenses/Poppins-OFL.txt \
            assets/genclient/lang/pl_pl.json \
            assets/genclient/lang/en_us.json
          do
            grep -Fqx "$entry" /tmp/gen-client-jar-contents.txt
          done

          unzip -p "$JAR" fabric.mod.json > /tmp/gen-client-fabric-mod.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("/tmp/gen-client-fabric-mod.json").read_text())
          assert metadata["id"] == "genclient", metadata
          assert metadata["environment"] == "client", metadata
          assert metadata["version"] == "0.3.0", metadata
          assert metadata["entrypoints"]["client"] == ["pl.genclient.client.GenClient"], metadata
          assert "genclient.mixins.json" in metadata["mixins"], metadata
          print(json.dumps(metadata, indent=2))
          PY

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          jar = Path("build/libs") / f"gen-client-{Path('gradle.properties').read_text().split('mod_version=')[1].splitlines()[0]}.jar"
          with zipfile.ZipFile(jar) as archive:
              for name in (
                  "assets/genclient/font/Poppins-Regular.ttf",
                  "assets/genclient/font/Poppins-Medium.ttf",
              ):
                  data = archive.read(name)
                  assert data[:4] == b"\\x00\\x01\\x00\\x00", (name, data[:4])
                  assert len(data) > 100_000, (name, len(data))
              assert b"SIL OPEN FONT LICENSE Version 1.1" in archive.read("licenses/Poppins-OFL.txt")
          print("Packaged TTF signatures, sizes and font license verified.")
          PY

          mkdir -p build/distribution
          cp "$JAR" build/distribution/GEN-CLIENT-1.21.1.jar
          test -s build/distribution/GEN-CLIENT-1.21.1.jar
          jar tf build/distribution/GEN-CLIENT-1.21.1.jar >/dev/null
          sha256sum build/distribution/GEN-CLIENT-1.21.1.jar

      - uses: actions/upload-artifact@v4
        with:
          name: GEN-CLIENT-1.21.1
          path: build/distribution/GEN-CLIENT-1.21.1.jar
          if-no-files-found: error
          retention-days: 14
