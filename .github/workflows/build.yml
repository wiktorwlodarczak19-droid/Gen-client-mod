name: Build GEN CLIENT
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Inspect and verify source layout
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Java sources in checkout ==="
          find src/main/java -type f -name '*.java' -print
          echo "=== Resources in checkout ==="
          find src/main/resources -type f -print
          test -f src/main/java/pl/genclient/GenClient.java
          test -f src/main/java/pl/genclient/VisualsScreen.java
          test -f src/main/java/pl/genclient/ModBadgeHud.java
          test -f src/main/resources/fabric.mod.json

      - name: Build mod with Fabric Loom
        run: gradle --no-daemon --no-build-cache clean build

      - name: Verify the remapped Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/gen-client-0.1.0.jar"

          echo "=== Build output archives ==="
          find build -type f -name '*.jar' -printf '%p (%s bytes)\n' | sort
          echo "=== Expected distributable ==="
          test -s "$JAR"
          SIZE="$(stat -c '%s' "$JAR")"
          echo "JAR size: $SIZE bytes"
          test "$SIZE" -gt 1000

          jar tf "$JAR" | tee /tmp/gen-client-jar-contents.txt
          grep -qx 'pl/genclient/GenClient.class' /tmp/gen-client-jar-contents.txt
          grep -qx 'pl/genclient/VisualsScreen.class' /tmp/gen-client-jar-contents.txt
          grep -qx 'pl/genclient/ModBadgeHud.class' /tmp/gen-client-jar-contents.txt
          grep -qx 'fabric.mod.json' /tmp/gen-client-jar-contents.txt

          unzip -p "$JAR" fabric.mod.json > /tmp/gen-client-fabric-mod.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("/tmp/gen-client-fabric-mod.json").read_text())
          assert metadata["id"] == "genclient", metadata
          assert metadata["environment"] == "client", metadata
          assert metadata["entrypoints"]["client"] == ["pl.genclient.GenClient"], metadata
          assert metadata["version"] == "0.1.0", metadata
          print(json.dumps(metadata, indent=2))
          PY

          mkdir -p build/distribution
          cp "$JAR" build/distribution/GEN-CLIENT-1.21.1.jar
          test -s build/distribution/GEN-CLIENT-1.21.1.jar
          echo "Verified final installable JAR:"
          ls -lh build/distribution/GEN-CLIENT-1.21.1.jar
          jar tf build/distribution/GEN-CLIENT-1.21.1.jar >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: GEN-CLIENT-1.21.1
          path: build/distribution/GEN-CLIENT-1.21.1.jar
          if-no-files-found: error
          retention-days: 14
